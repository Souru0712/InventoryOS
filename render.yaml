# InventoryOS staging on Render (T0.09, ADR-0002).
#
# Create it once: Render dashboard -> New -> Blueprint -> this repository. Render lists the
# services and their monthly cost before anything is created. Later changes to this file are
# applied by Render when they reach main.
#
# Secrets never live in this file. The values marked `sync: false` are asked for once, when the
# Blueprint is created; enter the same ENCRYPTION_KEY, SENTRY_DSN and APP_BASE_URL for both
# services. SECRET_KEY is generated by Render.

services:
  - type: web
    name: inventoryos-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Closest to the owner (New York) and to Square's and Stripe's US endpoints.
    region: virginia
    # One instance until invoice photos move into Postgres (C-48, ADR-0024): a photo on one
    # instance's disk is invisible to another and is lost at every deploy.
    numInstances: 1
    # /readyz answers 200 only when the database is reachable.
    healthCheckPath: /readyz
    # Deploy main only once its required CI checks have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_BASE_URL
        # The service's https URL, e.g. https://inventoryos-staging.onrender.com
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: inventoryos-staging-db
          property: connectionString
      # Scheduled jobs run only in the scheduler service below.
      - key: RUN_SCHEDULER_IN_WEB
        value: "false"
      # Until C-48's database storage lands; then this becomes "database".
      - key: STORAGE_BACKEND
        value: local

  - type: worker
    name: inventoryos-staging-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.cli scheduler
    region: virginia
    # One runs the jobs under a Postgres advisory lock; a second would only stand by.
    numInstances: 1
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_BASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: inventoryos-staging-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local

databases:
  - name: inventoryos-staging-db
    # CI tests on PostgreSQL 16; the version cannot change after creation.
    postgresMajorVersion: "16"
    region: virginia
    databaseName: inventoryos
    user: inventoryos
    # Reachable only from Render's private network, not the internet.
    ipAllowList: []
