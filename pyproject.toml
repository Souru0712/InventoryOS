[project]
name = "stockpulse"
version = "0.1.0"
description = "Automated inventory intelligence for small businesses on Square"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "itsdangerous>=2.2",
    "bcrypt>=4.2",
    "cryptography>=43.0",
    "apscheduler>=3.10",
    "stripe>=11.1",
    "python-dateutil>=2.9",
    "anthropic>=0.69",
    "pillow>=10.4",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "sentry-sdk[fastapi]>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.4",
]

[tool.uv]
# The repository is an application, not a library: uv installs its dependencies only and never
# builds it (setuptools' flat-layout discovery refuses app/ + migrations/).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
# The audit probes under docs/ are frozen evidence from the Phase 2 audit, not maintained code.
extend-exclude = ["docs"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, and bandit's security rules (ID-04).
select = ["E", "W", "F", "I", "B", "UP", "S"]
ignore = [
    # str + Enum -> StrEnum changes what str() and format() return; not a mechanical change.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# pytest asserts; fixtures imported from other test modules read as redefinitions; fixed
# throwaway passwords in test data.
"tests/**" = ["S101", "F811", "S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in parameter defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
# Gradual typing (ID-04): mypy's defaults here, strict for the modules in the next section.
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Strict from the first line: the pure transform layer, and the access and ledger modules to come.
module = ["app.transform.*", "app.access.*", "app.ledger.*"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true

[[tool.mypy.overrides]]
# The snack-box module leaves this repository in T0.05 (C-37); typing it here would be wasted.
module = [
    "app.orchestration.boxes",
    "app.orchestration.customers",
    "app.orchestration.referrals",
    "app.web.boxes",
    "app.web.shop",
]
ignore_errors = true

[[tool.mypy.overrides]]
# These ship no type information; stub packages would be new dependencies for a few call sites.
module = ["apscheduler.*", "boto3", "botocore.*"]
ignore_missing_imports = true
