[project]
name = "stockpulse"
version = "0.1.0"
description = "Automated inventory intelligence for small businesses on Square"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "itsdangerous>=2.2",
    "bcrypt>=4.2",
    "cryptography>=43.0",
    "apscheduler>=3.10",
    "stripe>=11.1",
    "python-dateutil>=2.9",
    "anthropic>=0.69",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
