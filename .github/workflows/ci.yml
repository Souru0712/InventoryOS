name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash runs with -eo pipefail; the implicit default does not, which would let
    # `pytest | tee` hide a failing test run.
    shell: bash

jobs:
  sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        # Dependencies only, as the Dockerfile does: the repository is not packaged (setuptools'
        # flat-layout discovery refuses app/ + migrations/). T0.03 replaces this with a lockfile.
        run: |
          python - > requirements-ci.txt <<'PY'
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          for requirement in project["dependencies"] + project["optional-dependencies"]["dev"]:
              print(requirement)
          PY
          python -m pip install -r requirements-ci.txt
      - name: Documentation contract
        run: python scripts/check_docs.py
      - name: Test suite
        run: python -m pytest -q -p no:cacheprovider

  postgres:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The steps run in a container on the database's Docker network and reach it by service
    # name, so no host port is published (run #2 failed starting Docker's port proxy).
    container: python:3.12-slim
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway database inside the job; these values are not secrets.
        env:
          POSTGRES_USER: inventoryos
          POSTGRES_PASSWORD: inventoryos
          POSTGRES_DB: inventoryos_test
        options: >-
          --health-cmd "pg_isready -U inventoryos -d inventoryos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://inventoryos:inventoryos@postgres:5432/inventoryos_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        # Same as the SQLite job; Python 3.12 comes from the container image.
        run: |
          python - > requirements-ci.txt <<'PY'
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          for requirement in project["dependencies"] + project["optional-dependencies"]["dev"]:
              print(requirement)
          PY
          python -m pip install -r requirements-ci.txt
      - name: Test suite (no skips allowed)
        # The Postgres-only tests skip silently elsewhere; here every test must actually run.
        run: |
          python -m pytest -q -p no:cacheprovider -rs | tee pytest.log
          if grep -Eq "[0-9]+ skipped" pytest.log; then
            echo "::error::tests were skipped on PostgreSQL"
            exit 1
          fi
