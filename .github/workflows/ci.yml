name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash runs with -eo pipefail; the implicit default does not, which would let
    # `pytest | tee` hide a failing test run.
    shell: bash

env:
  UV_VERSION: "0.13.7"
  # Use the job's Python 3.12; never download an interpreter.
  UV_PYTHON_DOWNLOADS: never

jobs:
  sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        # --frozen: install exactly uv.lock and fail if it no longer matches pyproject.toml.
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --frozen
      - name: Documentation contract
        run: uv run --frozen python scripts/check_docs.py
      - name: Test suite
        run: uv run --frozen pytest -q -p no:cacheprovider

  postgres:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The steps run in a container on the database's Docker network and reach it by service
    # name, so no host port is published (run #2 failed starting Docker's port proxy).
    container: python:3.12-slim
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway database inside the job; these values are not secrets.
        env:
          POSTGRES_USER: inventoryos
          POSTGRES_PASSWORD: inventoryos
          POSTGRES_DB: inventoryos_test
        options: >-
          --health-cmd "pg_isready -U inventoryos -d inventoryos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://inventoryos:inventoryos@postgres:5432/inventoryos_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install locked dependencies
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --frozen
      - name: Test suite (no skips allowed)
        # The Postgres-only tests skip silently elsewhere; here every test must actually run.
        run: |
          uv run --frozen pytest -q -p no:cacheprovider -rs | tee pytest.log
          if grep -Eq "[0-9]+ skipped" pytest.log; then
            echo "::error::tests were skipped on PostgreSQL"
            exit 1
          fi

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --frozen
      - name: Lint (ruff)
        run: uv run --frozen ruff check --output-format github .
      - name: Formatting (ruff)
        run: uv run --frozen ruff format --check .
      - name: Types (mypy)
        # Configured in pyproject.toml: strict for app/transform, gradual elsewhere.
        run: uv run --frozen mypy

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit every locked package for known vulnerabilities
        # Hashed, fully pinned requirements let pip-audit check them without installing anything.
        # A finding fails the job; an accepted one is ignored only with --ignore-vuln and an ADR.
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv export --frozen --format requirements-txt --no-emit-project --output-file requirements-audit.txt
          uvx --from "pip-audit==2.10.1" pip-audit --disable-pip --requirement requirements-audit.txt

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build --tag inventoryos:ci .
      - name: Installed versions match uv.lock
        run: |
          docker run --rm inventoryos:ci python -c "import importlib.metadata as m; print('\n'.join(f'{d.metadata[\"Name\"]}=={d.version}' for d in m.distributions()))" > image-packages.txt
          python3 scripts/check_lock_matches.py uv.lock image-packages.txt
