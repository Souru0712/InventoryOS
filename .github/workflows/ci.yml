name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Documentation contract
        run: python scripts/check_docs.py
      - name: Test suite
        run: python -m pytest -q -p no:cacheprovider

  postgres:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway database inside the job; these values are not secrets.
        env:
          POSTGRES_USER: inventoryos
          POSTGRES_PASSWORD: inventoryos
          POSTGRES_DB: inventoryos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventoryos -d inventoryos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://inventoryos:inventoryos@localhost:5432/inventoryos_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test suite (no skips allowed)
        # The Postgres-only tests skip silently elsewhere; here every test must actually run.
        run: |
          python -m pytest -q -p no:cacheprovider -rs | tee pytest.log
          if grep -Eq "[0-9]+ skipped" pytest.log; then
            echo "::error::tests were skipped on PostgreSQL"
            exit 1
          fi
