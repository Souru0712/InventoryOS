{% extends "base.html" %}
{% block content %}
<div style="max-width: 480px; margin: 20px auto;">
  <h1>Check your email</h1>
  <div class="card">
    <p style="margin-top:0">If <strong>{{ email }}</strong> can receive mail, a sign-in link is on its way.
    It works once and expires in {{ settings.customer_login_ttl_minutes }} minutes.</p>
    <p class="small muted" style="margin-bottom:0">Nothing arrived? Check spam, or
    <a href="/shop/{{ shop.id }}/login">ask for another link</a>.</p>
  </div>
</div>
{% endblock %}
