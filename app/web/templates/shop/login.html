{% extends "base.html" %}
{% block content %}
<div style="max-width: 440px; margin: 20px auto;">
  <h1>Sign in</h1>
  <p class="lede">No password. We email you a link that signs you in once.</p>
  {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
  <form class="card" method="post" action="/shop/{{ shop.id }}/login">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>
    </div>
    <button class="btn" type="submit">Email me a sign-in link</button>
  </form>
  <p class="small muted">New here? The same link creates your account.</p>
</div>
{% endblock %}
