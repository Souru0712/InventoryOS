{% extends "base.html" %}
{% block content %}
<div style="max-width: 420px; margin: 20px auto;">
  <h1>Log in</h1>
  {% if request.query_params.get("reset") %}<div class="notice ok">Your password is changed. Log in with the new one.</div>{% endif %}
  {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
  <form class="card" method="post" action="/login">{{ csrf_field(request) }}
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
    </div>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="small muted"><a href="/password/forgot">Forgot your password?</a> &middot;
  New here? <a href="/signup">Create a workspace</a>.</p>
</div>
{% endblock %}
