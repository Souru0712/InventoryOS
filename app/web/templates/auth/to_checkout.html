{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:460px; margin:60px auto; text-align:center;">
  <h1 style="margin:0 0 8px;">Your workspace is ready</h1>
  <p class="lede">Taking you to Stripe to set up {{ plan|capitalize }}. Your 30 days are free either way.</p>
  <form method="post" action="/billing/checkout" id="to-checkout">{{ csrf_field(request) }}
    <input type="hidden" name="plan" value="{{ plan }}">
    <button class="btn" type="submit">Continue to payment</button>
  </form>
  <p class="small muted" style="margin:14px 0 0;">
    <a href="/app">Skip for now</a> and start your trial.
  </p>
</div>
<script nonce="{{ request.state.csp_nonce }}">document.getElementById("to-checkout").submit();</script>
{% endblock %}
