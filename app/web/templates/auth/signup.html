{% extends "base.html" %}
{% block content %}
<div style="max-width: 420px; margin: 20px auto;">
  <h1>Start free</h1>
  <p class="lede">Create your workspace, then connect Square.</p>
  {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
  <form class="card" method="post" action="/signup">{{ csrf_field(request) }}
    {% if plan %}<input type="hidden" name="plan" value="{{ plan }}">{% endif %}
    <div class="field">
      <label for="business_name">Business name</label>
      <input id="business_name" name="business_name" value="{{ business_name or '' }}" required autofocus>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email or '' }}" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="10" required>
      <p class="small muted" style="margin: 6px 0 0;">At least 10 characters.</p>
    </div>
    <button class="btn" type="submit">Create workspace</button>
  </form>
  <p class="small muted">Already have an account? <a href="/login">Log in</a>.</p>
</div>
{% endblock %}
