<!doctype html>
<html>
<body style="margin:0; padding:24px; background:#f7faf8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#14211c;">
  <div style="max-width:560px; margin:0 auto; background:#fff; border:1px solid #dbe4df; border-radius:12px; padding:24px;">
    <h1 style="margin:0 0 12px; font-size:20px;">{{ provider }} is no longer connected</h1>
    <p style="margin:0 0 18px; line-height:1.5;">{{ provider }} stopped accepting {{ business }}'s connection, so new sales are not coming in and stock is not being taken out for them. Your history is kept.</p>
    <p style="margin:0 0 18px;">
      <a href="{{ link }}" style="display:inline-block; background:#1f6f4a; color:#fff; text-decoration:none; padding:10px 18px; border-radius:8px; font-weight:600;">Reconnect {{ provider }}</a>
    </p>
    <p style="margin:0; font-size:13px; color:#5d6f67; line-height:1.5;">If you disconnected it on purpose, you can ignore this email.<br>{{ link }}</p>
  </div>
</body>
</html>
