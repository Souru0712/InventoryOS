<!doctype html>
<html>
<body style="margin:0; padding:24px; background:#f7faf8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#14211c;">
  <div style="max-width:560px; margin:0 auto; background:#fff; border:1px solid #dbe4df; border-radius:12px; padding:24px;">
    <h1 style="margin:0 0 12px; font-size:20px;">Confirm your email</h1>
    <p style="margin:0 0 18px; line-height:1.5;">Confirm that {{ email }} is yours, and StockPulse can read invoices and connect your POS.</p>
    <p style="margin:0 0 18px;">
      <a href="{{ link }}" style="display:inline-block; background:#1f6f4a; color:#fff; text-decoration:none; padding:10px 18px; border-radius:8px; font-weight:600;">Confirm my email</a>
    </p>
    <p style="margin:0; font-size:13px; color:#5d6f67; line-height:1.5;">The link works for 48 hours. If you did not create an account, ignore this email.<br>{{ link }}</p>
  </div>
</body>
</html>
